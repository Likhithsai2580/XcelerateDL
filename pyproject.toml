[project]
name = "xceleratedl-s2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.17",
    "eel>=0.18.1",
    "fastapi>=0.115.12",
    "jinja2>=3.1.6",
    "pip>=25.1.1",
    "pydantic>=2.11.3",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "uvicorn[standard]>=0.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "B",
    "C4",
    "UP",
    "SIM",
    "TID",
    "E721",
    "TID252",
]
fixable = ["ALL"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
  "your_module/__init__.py"  # Change this to wherever you keep your __version__
]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
